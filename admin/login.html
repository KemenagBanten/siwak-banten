
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Admin - SIWAK Banten</title>

  <link rel="stylesheet" href="../css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #183153;
      background:
        radial-gradient(circle at top left, #dceafe, transparent 45%),
        linear-gradient(135deg, #f5f8fc, #eaf1f8);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 36px;
      background: #ffffff;
      border: 1px solid #e1e8f0;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(25, 55, 90, 0.12);
    }

    .login-logo {
      display: block;
      width: 76px;
      height: 76px;
      object-fit: contain;
      margin: 0 auto 18px;
    }

    .login-heading {
      margin: 0;
      text-align: center;
      font-size: 25px;
      font-weight: 700;
    }

    .login-subtitle {
      margin: 10px 0 28px;
      color: #64748b;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      min-height: 46px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .login-button {
      width: 100%;
      min-height: 48px;
      margin-top: 6px;
      border: 0;
      border-radius: 10px;
      color: #ffffff;
      background: #174a8b;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-button:hover {
      background: #123b70;
    }

    .login-button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .login-message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #fff1f2;
      color: #be123c;
      font-size: 13px;
      line-height: 1.5;
    }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <img
      class="login-logo"
      src="../assets/logo-kemenag.png"
      alt="Logo Kementerian Agama"
    >

    <h1 class="login-heading">Login SIWAK Banten</h1>

    <p class="login-subtitle">
      Sistem Informasi Wakaf<br>
      Kantor Wilayah Kementerian Agama Provinsi Banten
    </p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
<input id="email" name="email" type="email"
  autocomplete="username" required
  placeholder="Masukkan email admin">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Masukkan password"
        >
      </div>

      <button class="login-button" type="submit" disabled>
        Login
      </button>

      <div
        class="login-message"
        id="loginMessage"
        role="alert"
      ></div>
    </form>

    <div class="login-footer">
      © Kementerian Agama Provinsi Banten
    </div>
  </main>

  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  
<script>
  const SUPABASE_URL = 'https://xfsbjxnisagupgruzzcr.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'TEMPEL_PUBLISHABLE_KEY_ANDA';

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const loginForm = document.getElementById('loginForm');
  const loginButton = loginForm.querySelector('button[type="submit"]');
  const loginMessage = document.getElementById('loginMessage');

  // Aktifkan tombol setelah pustaka Supabase tersedia.
  loginButton.disabled = false;

  loginForm.addEventListener('submit', async function (event) {
    event.preventDefault();

    loginButton.disabled = true;
    loginButton.textContent = 'Memeriksa akun...';
    loginMessage.style.display = 'none';

    try {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // 1. Login melalui Supabase Auth.
      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        throw new Error('Login gagal. Periksa email dan password Anda.');
      }

      // 2. Minta Apps Script memverifikasi hak akses admin.
      const response = await fetch(
        'https://script.google.com/macros/s/AKfycbxNziYiLidgouOhoOVOkZP_gdr2ifXqAYwzmgfoSAPaRfIxCAD2NsgtK0r2S-l0noda/exec',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action: 'verifikasiAdmin',
            access_token: data.session.access_token
          })
        }
      );

      const result = await response.json();

      if (!result.success) {
        await supabaseClient.auth.signOut();
        throw new Error(result.message || 'Akun tidak memiliki akses admin.');
      }

      // Belum mengalihkan halaman sebelum dashboard admin tersedia.
      loginMessage.style.display = 'block';
      loginMessage.style.background = '#ecfdf5';
      loginMessage.style.color = '#166534';
      loginMessage.textContent =
        'Login berhasil. Akun admin terverifikasi. Dashboard belum diaktifkan.';

    } catch (error) {
      loginMessage.style.display = 'block';
      loginMessage.style.background = '#fff1f2';
      loginMessage.style.color = '#be123c';
      loginMessage.textContent = error.message;
    } finally {
      loginButton.disabled = false;
      loginButton.textContent = 'Login';
    }
  });
</script>
  
</body>
</html>
