
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Admin - SIWAK Banten</title>

  <link rel="stylesheet" href="../css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #183153;
      background:
        radial-gradient(circle at top left, #dceafe, transparent 45%),
        linear-gradient(135deg, #f5f8fc, #eaf1f8);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 36px;
      background: #ffffff;
      border: 1px solid #e1e8f0;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(25, 55, 90, 0.12);
    }

    .login-logo {
      display: block;
      width: 76px;
      height: 76px;
      object-fit: contain;
      margin: 0 auto 18px;
    }

    .login-heading {
      margin: 0;
      text-align: center;
      font-size: 25px;
      font-weight: 700;
    }

    .login-subtitle {
      margin: 10px 0 28px;
      color: #64748b;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      min-height: 46px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .login-button {
      width: 100%;
      min-height: 48px;
      margin-top: 6px;
      border: 0;
      border-radius: 10px;
      color: #ffffff;
      background: #174a8b;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-button:hover {
      background: #123b70;
    }

    .login-button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .login-message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #fff1f2;
      color: #be123c;
      font-size: 13px;
      line-height: 1.5;
    }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <img
      class="login-logo"
      src="../assets/logo-kemenag.png"
      alt="Logo Kementerian Agama"
    >

    <h1 class="login-heading">Login SIWAK Banten</h1>

    <p class="login-subtitle">
      Sistem Informasi Wakaf<br>
      Kantor Wilayah Kementerian Agama Provinsi Banten
    </p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
<input id="email" name="email" type="email"
  autocomplete="username" required
  placeholder="Masukkan email admin">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Masukkan password"
        >
      </div>

      <button class="login-button" type="submit" disabled>
        Login
      </button>

      <div
        class="login-message"
        id="loginMessage"
        role="alert"
      ></div>
    </form>

    <div class="login-footer">
      © Kementerian Agama Provinsi Banten
    </div>
  </main>

  <script>
    // Login akan diaktifkan setelah autentikasi
    // sisi server Apps Script siap.
    document.getElementById('loginForm').addEventListener(
      'submit',
      function (event) {
        event.preventDefault();
      }
    );
  </script>
</body>
</html>
