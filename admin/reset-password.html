
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atur Ulang Password - SIWAK Banten</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #183153;
      background: linear-gradient(135deg, #f5f8fc, #eaf1f8);
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: #fff;
      border: 1px solid #e1e8f0;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(25, 55, 90, .12);
    }
    .logo {
      display: block;
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin: 0 auto 18px;
    }
    h1 { text-align: center; font-size: 24px; }
    p { color: #64748b; line-height: 1.6; font-size: 14px; }
    label { display: block; margin: 18px 0 8px; font-weight: 600; font-size: 14px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #174a8b;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { display: none; margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
    .back { display: block; margin-top: 18px; text-align: center; color: #174a8b; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../assets/logo-kemenag.png" alt="Logo Kementerian Agama">
    <h1>Atur Ulang Password</h1>
    <p>Buat password baru untuk akun admin SIWAK Banten. Gunakan minimal 12 karakter.</p>

    <form id="resetForm">
      <label for="password">Password baru</label>
      <input id="password" type="password" minlength="12" autocomplete="new-password" required>

      <label for="confirmPassword">Ulangi password baru</label>
      <input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required>

      <button id="saveButton" type="submit">Simpan Password Baru</button>
      <div id="message" role="status"></div>
    </form>

    <a class="back" href="./login.html">Kembali ke Login</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://xfsbjxnisagupgruzzcr.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_TUNikbzwvKJggJWoUVRXWA_ru3Riq4k';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById('resetForm');
    const button = document.getElementById('saveButton');
    const message = document.getElementById('message');

    function showMessage(text, success) {
      message.style.display = 'block';
      message.style.background = success ? '#ecfdf5' : '#fff1f2';
      message.style.color = success ? '#166534' : '#be123c';
      message.textContent = text;
    }

    async function prepareRecovery() {
      const url = new URL(window.location.href);
      const queryError = url.searchParams.get('error_description');
      const hash = new URLSearchParams(url.hash.replace(/^#/, ''));
      const hashError = hash.get('error_description');

      if (queryError || hashError) {
        showMessage(
          'Tautan pemulihan tidak valid atau kedaluwarsa. Minta email reset password baru.',
          false
        );
        button.disabled = true;
        return;
      }

      const code = url.searchParams.get('code');

      if (code) {
        const { error } = await supabaseClient.auth.exchangeCodeForSession(code);

        if (error) {
          showMessage('Tautan pemulihan tidak valid atau kedaluwarsa. Minta email baru.', false);
          button.disabled = true;
          return;
        }

        history.replaceState(null, '', url.pathname);
        return;
      }

      // Supabase dapat mengirim token pemulihan di bagian hash URL.
      const accessToken = hash.get('access_token');
      const refreshToken = hash.get('refresh_token');
      const type = hash.get('type');

      if (accessToken && refreshToken && type === 'recovery') {
        const { error } = await supabaseClient.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

        if (error) {
          showMessage('Sesi pemulihan tidak valid. Minta email reset password baru.', false);
          button.disabled = true;
          return;
        }

        history.replaceState(null, '', url.pathname);
        return;
      }

      const { data } = await supabaseClient.auth.getSession();

      if (!data.session) {
        showMessage('Buka halaman ini melalui tautan reset password terbaru dari email Anda.', false);
        button.disabled = true;
      }
    }

    form.addEventListener('submit', async function(event) {
      event.preventDefault();

      const password = document.getElementById('password').value;
      const confirmation = document.getElementById('confirmPassword').value;

      if (password.length < 12) {
        showMessage('Password harus minimal 12 karakter.', false);
        return;
      }

      if (password !== confirmation) {
        showMessage('Kedua password tidak sama.', false);
        return;
      }

      button.disabled = true;
      button.textContent = 'Menyimpan...';

      try {
        const { data } = await supabaseClient.auth.getSession();

        if (!data.session) {
          throw new Error('Sesi pemulihan tidak tersedia. Minta email reset password baru.');
        }

        const { error } = await supabaseClient.auth.updateUser({
          password: password
        });

        if (error) throw error;

        await supabaseClient.auth.signOut();

        showMessage('Password berhasil diubah. Silakan kembali ke halaman Login.', true);
        form.reset();
      } catch (error) {
        showMessage(error.message || 'Password belum berhasil diubah.', false);
      } finally {
        button.disabled = false;
        button.textContent = 'Simpan Password Baru';
      }
    });

    prepareRecovery().catch(function() {
      showMessage('Tidak dapat memeriksa tautan pemulihan. Minta email reset password baru.', false);
      button.disabled = true;
    });
  </script>
</body>
</html>
