<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Test Upload SIWAK Banten</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f7f6;
    }

    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
      color: #0f5132;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 7px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      margin-top: 22px;
      background: #0f5132;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0b3d25;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      background: #f1f3f2;
      border-radius: 7px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>Test Upload SIWAK Banten</h2>

    <p>
      Halaman ini digunakan untuk menguji upload dokumen
      dari browser ke Google Drive melalui Apps Script.
    </p>

    <label for="idWakaf">
      ID Wakaf
    </label>

    <input
      type="text"
      id="idWakaf"
      value="WAK-000001"
    >

    <label for="jenisDokumen">
      Jenis Dokumen
    </label>

    <select id="jenisDokumen">

      <option value="AIW">AIW</option>
      <option value="APAIW">APAIW</option>
      <option value="SERTIFIKAT">SERTIFIKAT</option>
      <option value="SURAT_UKUR">SURAT UKUR</option>
      <option value="AKTA">AKTA</option>
      <option value="SPPT">SPPT</option>
      <option value="PETA_BIDANG">PETA BIDANG</option>
      <option value="SURAT_PERNYATAAN">SURAT PERNYATAAN</option>
      <option value="DOKUMEN_PENDUKUNG">DOKUMEN PENDUKUNG</option>
      <option value="LAINNYA">LAINNYA</option>

    </select>

    <label for="idOperator">
      ID Operator
    </label>

    <input
      type="text"
      id="idOperator"
      value="USR-000001"
    >

    <label for="fileInput">
      Pilih File
    </label>

    <input
      type="file"
      id="fileInput"
    >

    <button
      id="uploadButton"
      onclick="uploadDokumen()"
    >
      Upload Dokumen
    </button>

    <div id="status">
      Belum ada proses upload.
    </div>

  </div>


  <script>

    const API_URL =
      'https://script.google.com/macros/s/AKfycbxNziYiLidgouOhoOVOkZP_gdr2ifXqAYwzmgfoSAPaRfIxCAD2NsgtK0r2S-l0noda/exec';


    async function uploadDokumen() {

      const idWakaf =
        document.getElementById('idWakaf').value.trim();

      const jenisDokumen =
        document.getElementById('jenisDokumen').value;

      const idOperator =
        document.getElementById('idOperator').value.trim();

      const fileInput =
        document.getElementById('fileInput');

      const file =
        fileInput.files[0];

      const status =
        document.getElementById('status');

      const button =
        document.getElementById('uploadButton');


      if (!idWakaf) {
        status.textContent =
          'ID Wakaf belum diisi.';
        return;
      }


      if (!idOperator) {
        status.textContent =
          'ID Operator belum diisi.';
        return;
      }


      if (!file) {
        status.textContent =
          'Silakan pilih file terlebih dahulu.';
        return;
      }


      button.disabled = true;

      button.textContent =
        'Mengupload...';


      status.textContent =
        'Membaca file...';


      try {

        const fileData =
          await readFileAsBase64(file);


        status.textContent =
          'Mengirim file ke server...';


        const payload = {

          action:
            'uploadDokumen',

          id_wakaf:
            idWakaf,

          jenis_dokumen:
            jenisDokumen,

          nama_file:
            file.name,

          fileData:
            fileData,

          id_operator:
            idOperator
        };


        const response =
          await fetch(
            API_URL,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'text/plain;charset=utf-8'
              },

              body:
                JSON.stringify(payload)
            }
          );


        const result =
          await response.json();


        status.textContent =
          JSON.stringify(
            result,
            null,
            2
          );


        if (result.success) {

          button.textContent =
            'Upload Berhasil';

        } else {

          button.textContent =
            'Upload Gagal';

        }


      } catch (error) {

        console.error(error);

        status.textContent =
          'ERROR:\n' +
          error.message;

        button.textContent =
          'Upload Gagal';

      } finally {

        button.disabled = false;

      }

    }


    function readFileAsBase64(file) {

      return new Promise(
        function(resolve, reject) {

          const reader =
            new FileReader();


          reader.onload =
            function() {

              resolve(
                reader.result
              );

            };


          reader.onerror =
            function() {

              reject(
                new Error(
                  'Gagal membaca file.'
                )
              );

            };


          reader.readAsDataURL(file);

        }
      );

    }

  </script>

</body>

</html>
